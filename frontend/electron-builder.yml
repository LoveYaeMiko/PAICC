appId: com.paicc.app
productName: PAICC
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - "!**/.vscode/*"
  - "!src/*"
asarUnpack:
  - resources/**
win:
  target:
    - nsis
  # We ship unsigned (no code-signing cert) and don't need a custom icon/version
  # resource. Disabling exe editing skips the winCodeSign toolchain download, which
  # otherwise fails on Windows because its 7z bundles macOS symlinks that need the
  # SeCreateSymbolicLinkPrivilege to extract.
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
